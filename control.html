<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Control</title>
  <style>
    :root {
      --bg: #0f1020; --panel: #171a33; --line: #2e3463; --text: #eef0ff; --muted: #9aa0c8;
      --accent: #8b93ff; --accent2: #ffcf5c; --good: #4ade80; --bad: #ff5c7a;
      --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); padding: 16px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h1 span { color: var(--accent); }
    h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .status { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
    .dot { font-weight: 700; }
    .ok { color: var(--good); } .no { color: var(--bad); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .stats b { display: block; font-size: 22px; }
    .stats small { color: var(--muted); }
    #diff { text-transform: capitalize; }
    .bar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; margin: 12px 0 4px; }
    .bar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }
    ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
    ol li { display: flex; justify-content: space-between; gap: 8px; background: rgba(255,255,255,.04); border-radius: 6px; padding: 4px 8px; }
    ol li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 12px 10px; background: var(--accent); color: #0f1020; cursor: pointer; }
    button:active { transform: scale(.97); }
    button.wide { grid-column: 1 / -1; }
    button.easy { background: #4ade80; } button.medium { background: #ffcf5c; } button.hard { background: #ff7a93; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
    button.danger.armed { background: var(--bad); color: #0f1020; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    #log { margin-top: 8px; font-size: 13px; color: var(--accent2); min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>Sudoku <span>Control</span></h1>
  <div class="status">
    <span>Game source: <span id="game-state" class="dot no">○ not found</span></span>
    <span>Chat: <span id="chat-state">—</span></span>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Current puzzle</h2>
      <div class="stats">
        <div><b id="round">—</b><small>Puzzle</small></div>
        <div><b id="diff">—</b><small>Difficulty</small></div>
        <div><b id="left">—</b><small>Cells left</small></div>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <ol id="top"></ol>
    </section>

    <section class="card">
      <h2>Puzzle</h2>
      <div class="btns">
        <button class="wide" data-cmd="new">New puzzle (next in rotation)</button>
        <button class="easy" data-cmd="new" data-arg="easy">New easy</button>
        <button class="medium" data-cmd="new" data-arg="medium">New medium</button>
        <button class="hard" data-cmd="new" data-arg="hard">New hard</button>
        <button class="ghost" data-cmd="hint">Reveal a hint</button>
      </div>
    </section>

    <section class="card">
      <h2>Scores</h2>
      <div class="btns">
        <button class="danger wide" data-cmd="resetround" data-confirm>Reset this puzzle's scores</button>
        <button class="danger wide" data-cmd="resetscores" data-confirm>Reset ALL-TIME scores</button>
      </div>
      <p class="hint">Click once, then click again within 3 seconds to confirm.</p>
    </section>

    <section class="card">
      <h2>Play as streamer</h2>
      <form id="chat-form">
        <input id="chat-text" placeholder="e.g. B7 4" autocomplete="off">
        <button>Send</button>
      </form>
      <p class="hint">Counts as a move from you, without typing in Twitch chat.</p>
    </section>
  </div>
  <div id="log"></div>

  <script>
    const LS_CMD = 'numbersonstream.cmd', LS_CUR = 'numbersonstream.current',
          LS_STATUS = 'numbersonstream.status', LS_HEARTBEAT = 'numbersonstream.heartbeat';
    const $ = (s) => document.querySelector(s);
    const read = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
    let bc = null; try { bc = new BroadcastChannel('numbersonstream'); } catch {}

    function send(cmd, arg, label) {
      const c = { id: Math.random().toString(36).slice(2) + Date.now(), cmd, arg: arg || '', t: Date.now() };
      try { localStorage.setItem(LS_CMD, JSON.stringify(c)); } catch {}
      if (bc) bc.postMessage(c);
      $('#log').textContent = `Sent: ${label}`;
      setTimeout(refresh, 300);
    }

    document.querySelectorAll('button[data-cmd]').forEach((b) => {
      let timer = null;
      const original = b.textContent;
      b.addEventListener('click', () => {
        if (b.hasAttribute('data-confirm') && !b.classList.contains('armed')) {
          b.classList.add('armed'); b.textContent = 'Click again to confirm';
          timer = setTimeout(() => { b.classList.remove('armed'); b.textContent = original; }, 3000);
          return;
        }
        clearTimeout(timer); b.classList.remove('armed'); b.textContent = original;
        send(b.dataset.cmd, b.dataset.arg, original);
      });
    });

    $('#chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = $('#chat-text').value.trim();
      if (!t) return;
      send('chat', t, `"${t}"`);
      $('#chat-text').value = '';
    });

    function refresh() {
      const beat = +localStorage.getItem(LS_HEARTBEAT) || 0;
      const live = Date.now() - beat < 4000;
      const gs = $('#game-state');
      gs.textContent = live ? '● running' : '○ not found — is the game source loaded with the same kind of URL?';
      gs.className = 'dot ' + (live ? 'ok' : 'no');
      const st = read(LS_STATUS);
      $('#chat-state').textContent = st ? st.text : '—';
      const s = read(LS_CUR);
      if (!s || !s.grid) return;
      const filled = s.grid.filter(Boolean).length;
      $('#round').textContent = '#' + s.round;
      $('#diff').textContent = s.difficulty;
      $('#left').textContent = 81 - filled;
      $('#bar').style.width = (filled / 81 * 100) + '%';
      const top = Object.values(s.scores || {}).sort((a, b) => b.points - a.points).slice(0, 5);
      const ol = $('#top'); ol.replaceChildren();
      for (const p of top) {
        const li = document.createElement('li');
        const n = document.createElement('span'); n.textContent = p.name; n.style.color = p.color;
        const v = document.createElement('span'); v.textContent = p.points + ' pts';
        li.append(n, v); ol.append(li);
      }
      if (!top.length) ol.append(Object.assign(document.createElement('li'), { textContent: 'No points yet' }));
    }
    setInterval(refresh, 1000);
    refresh();
  </script>
</body>
</html>
